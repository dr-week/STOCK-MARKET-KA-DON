name: Backend Keep-Alive (NSE Hours)

on:
  schedule:
    # Every 14 minutes during NSE weekday market hours (03:30-10:00 UTC = 09:00-15:30 IST)
    - cron: '*/14 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-health:
    name: Ping Render /health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Warm up backend /health
        env:
          BACKEND_URL: ${{ vars.SMKD_BACKEND_URL || 'https://smkd-backend.onrender.com' }}
        run: |
          URL="${BACKEND_URL%/}/health"
          echo "Pinging $URL ..."
          code=$(curl -sS -o /tmp/health.out -w "%{http_code}" --max-time 45 "$URL" || echo "000")
          echo "HTTP status: $code"
          cat /tmp/health.out 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::notice::Backend at $URL returned HTTP $code (deploy Render blueprint or set vars.SMKD_BACKEND_URL)."
          fi
