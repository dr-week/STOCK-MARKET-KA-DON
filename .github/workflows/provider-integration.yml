name: Live Provider Integration

on:
  schedule:
    # Run once daily at 09:45 AM IST (04:15 AM UTC), during active market trading window (Mon-Fri)
    - cron: '15 4 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Target NSE symbol ticker to test (e.g. RELIANCE)'
        required: false
        default: 'RELIANCE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-market-provider-check:
    name: Upstream Market Provider Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out SMKD repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'stock-signal-bot/backend/requirements-lock.txt'

      - name: Install dependencies
        run: |
          pip install --no-deps -r stock-signal-bot/backend/requirements-lock.txt

      - name: Run Live Upstream Provider Integration Tests
        env:
          SMKD_LIVE_PROVIDER_TESTS: '1'
        run: |
          python -m unittest stock-signal-bot/backend/app/tests/test_live_provider_integration.py -v
