name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation discovery and sync
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test documentation tools
        run: python -m unittest scripts.dev.tests.test_docs_tools -v
      - name: Require mapped docs in pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/dev/docs_tools/check.py --base origin/${{ github.base_ref }} --strict

  module-size-audit:
    name: Audit large source modules
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Report modules over 250 lines
        shell: pwsh
        run: ./scripts/dev/audit-large-modules.ps1 -Threshold 250 -Top 30

  backend-and-integrity:
    name: Backend & Data Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out SMKD repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'stock-signal-bot/backend/requirements-lock.txt'

      - name: Verify dependency manifest & install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r stock-signal-bot/backend/requirements-lock.txt

      - name: Run Deterministic Backend Tests & Market Data Integrity Checks
        run: |
          python -m unittest discover -s stock-signal-bot/backend/app/tests -v

  frontend-build-and-test:
    name: Frontend Build & UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out SMKD repository with submodule
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'fast-framework/pnpm-lock.yaml'

      - name: Install Frontend Dependencies (Frozen Lockfile)
        run: |
          cd fast-framework
          pnpm install --frozen-lockfile

      - name: Run Frontend Tests (Vitest)
        run: |
          cd fast-framework
          pnpm run test --run packages/stock-bot-ui

      - name: Build Stock Bot UI
        run: |
          cd fast-framework
          pnpm --filter stock-signal-bot-frontend run build
