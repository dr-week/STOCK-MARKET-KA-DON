name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.8.6
      - run: ruff check stock-signal-bot/backend/app scripts/dev

  documentation:
    name: Documentation discovery and sync
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest scripts.dev.tests.test_docs_tools -v
      - name: Require mapped docs in pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/dev/docs_tools/check.py --base origin/${{ github.base_ref }} --strict

  module-size-audit:
    name: Enforce 150-line module limit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Enforce 150-line limit on source modules
        run: |
          find stock-signal-bot/backend/app scripts/dev -name '*.py' -not -path '*/tests/*' \
            -exec wc -l {} + | awk '$2!="total" && $1>150 {print "OVER LIMIT: "$0; bad=1} END{exit bad+0}'

  harness:
    name: Agent harness evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml==6.0.2
      - run: python3 scripts/dev/run_harness.py eval
      - run: python3 -m unittest discover -s scripts/dev/tests

  backend-and-integrity:
    name: Backend & Data Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'stock-signal-bot/backend/requirements-lock.txt'
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r stock-signal-bot/backend/requirements-lock.txt
      - name: Run deterministic backend tests
        working-directory: stock-signal-bot/backend
        run: python -m unittest discover -s app/tests -t . -v
