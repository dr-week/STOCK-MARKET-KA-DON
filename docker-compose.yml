services:
  backend:
    build:
      context: .
      dockerfile: stock-signal-bot/Dockerfile
    container_name: smkd-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SMKD_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173,https://dr-week.github.io
    volumes:
      - smkd_data:/app/app/data

volumes:
  smkd_data:
    driver: local
