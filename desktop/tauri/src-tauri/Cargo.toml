[package]
name = "smkd-windows"
version = "2.0.0"
description = "Windows desktop shell with auto-updater for the SMKD dashboard"
authors = ["DISHANT NAIK"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
